apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-nexus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SrihanPrasad/Devops-assignment.git  # <-- change me
    targetRevision: main
    path: gitops/python-app/overlays/nexus
  destination:
    server: https://kubernetes.default.svc
    namespace: python-app-nexus
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
