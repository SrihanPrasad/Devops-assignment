apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: python-app-jfrog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SrihanPrasad/Devops-assignment.git   # <-- change me
    targetRevision: main
    path: gitops/python-app/overlays/jfrog
  destination:
    server: https://kubernetes.default.svc
    namespace: python-app-jfrog
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
